<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明和町カレー 抽選システム</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 90%;
            width: 400px;
            position: relative;
        }
        h1 { color: #333; margin-bottom: 20px; font-size: 24px; }
        .qr-placeholder {
            width: 200px;
            height: 200px;
            background: #eee;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #333;
            font-weight: bold;
            font-size: 14px;
        }
        .btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        .result-box { display: none; }
        .rank { font-size: 32px; font-weight: bold; color: #ff4757; margin-bottom: 10px; }
        .prize { font-size: 24px; font-weight: bold; color: #2f3542; margin-bottom: 20px; }
        .timer { color: #747d8c; font-size: 14px; }
        
        /* 設定ボタンとモーダル */
        .settings-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #a4b0be;
            cursor: pointer;
            font-size: 14px;
            text-decoration: underline;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 300px;
            text-align: left;
        }
        .modal-content h3 { margin-top: 0; }
        .stock-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 16px; }
        .close-btn { background: #747d8c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-top: 15px; }
        .reset-btn { background: #ff4757; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-top: 15px; float: right; }
    </style>
</head>
<body>

<div class="container">
    <button class="settings-btn" onclick="openSettings()">設定</button>

    <!-- 初期QR画面 -->
    <div id="qr-screen">
        <h1>お楽しみ抽選会！</h1>
        <!-- 必要に応じてここに本物のQRコード画像をいれてください -->
        <div class="qr-placeholder">
            <span style="padding: 10px;">ここにQRコード<br>(またはスキャン画面)</span>
        </div>
        <p style="color:#57606f; margin-bottom:30px;">ボタンを押して抽選スタート！</p>
        <button class="btn" onclick="drawLottery()">抽選を引く</button>
    </div>

    <!-- 結果表示画面 -->
    <div id="result-screen" class="result-box">
        <h1>抽選結果</h1>
        <div id="result-rank" class="rank">一等！</div>
        <div id="result-prize" class="prize">明和町カレー</div>
        <div id="result-timer" class="timer">10秒後に自動でもとの画面に戻ります</div>
    </div>
</div>

<!-- 設定モーダル -->
<div id="settings-modal" class="modal">
    <div class="modal-content">
        <h3>残り個数（在庫カウント）</h3>
        <div class="stock-item"><span>一等 明和町カレー:</span> <span id="stock-curry">20</span>個</div>
        <div class="stock-item"><span>一等 柿の種:</span> <span id="stock-kaki">8</span>個</div>
        <div class="stock-item"><span>二等 なしのしずく:</span> <span id="stock-pear">24</span>本</div>
        <div class="stock-item"><span>三等 うまい棒:</span> <span id="stock-umai">60</span>個</div>
        <button class="close-btn" onclick="closeSettings()">閉じる</button>
        <button class="reset-btn" onclick="resetStock()">リセット</button>
    </div>
</div>

<script>
    // 初期の景品個数
    const INITIAL_STOCK = { curry: 20, kaki: 8, pear: 24, umai: 60 };
    let stock = JSON.parse(localStorage.getItem('lottery_stock')) || { ...INITIAL_STOCK };
    let returnTimeout;
    let countdownInterval;

    function updateStockDisplay() {
        document.getElementById('stock-curry').innerText = stock.curry;
        document.getElementById('stock-kaki').innerText = stock.kaki;
        document.getElementById('stock-pear').innerText = stock.pear;
        document.getElementById('stock-umai').innerText = stock.umai;
        localStorage.setItem('lottery_stock', JSON.stringify(stock));
    }

    function openSettings() {
        updateStockDisplay();
        document.getElementById('settings-modal').style.display = 'flex';
    }
    function closeSettings() {
        document.getElementById('settings-modal').style.display = 'none';
    }
    function resetStock() {
        if(confirm('個数を最初のリセット状態に戻しますか？')) {
            stock = { ...INITIAL_STOCK };
            updateStockDisplay();
        }
    }

    function drawLottery() {
        let rand = Math.random() * 100; // 0〜100のランダム数字
        let rank = "";
        let prize = "";

        // 1. 確率による仮の等級決定 (一等20%, 二等30%, 三等50%)
        if (rand < 20) {
            // 一等
            if (stock.curry > 0 || stock.kaki > 0) {
                rank = "一等 🎉";
                // カレーか柿の種をランダム(50%ずつ)で判定
                if (stock.curry > 0 && stock.kaki > 0) {
                    if (Math.random() < 0.5) { stock.curry--; prize = "明和町カレー"; } 
                    else { stock.kaki--; prize = "柿の種"; }
                } else if (stock.curry > 0) { stock.curry--; prize = "明和町カレー"; } 
                else { stock.kaki--; prize = "柿の種"; }
            } else {
                // 一等の在庫がどちらもない場合はうまい棒へ降格
                rank = "三等";
                prize = "うまい棒 (一等終了のため)";
                if(stock.umai > 0) stock.umai--;
            }
        } else if (rand < 50) {
            // 二等 (20%〜50%の間 = 30%の確率)
            if (stock.pear > 0) {
                rank = "二等 ✨";
                prize = "なしのしずく";
                stock.pear--;
            } else {
                // 二等の在庫がない場合はうまい棒へ降格
                rank = "三等";
                prize = "うまい棒 (二等終了のため)";
                if(stock.umai > 0) stock.umai--;
            }
        } else {
            // 三等 (50%〜100%の間 = 50%の確率)
            rank = "三等 📢";
            prize = "うまい棒";
            if(stock.umai > 0) { stock.umai--; } 
            else { prize = "うまい棒 (おかわり！)"; } // うまい棒が0になってもうまい棒を出す
        }

        // 画面の表示切り替え
        document.getElementById('result-rank').innerText = rank;
        document.getElementById('result-prize').innerText = prize;
        document.getElementById('qr-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        // 10秒カウントダウンと自動リターン
        let timeLeft = 10;
        document.getElementById('result-timer').innerText = `${timeLeft}秒後にもとの画面に戻ります`;
        
        clearInterval(countdownInterval);
        countdownInterval = setInterval(() => {
            timeLeft--;
            if(timeLeft > 0) {
                document.getElementById('result-timer').innerText = `${timeLeft}秒後にもとの画面に戻ります`;
            } else {
                clearInterval(countdownInterval);
            }
        }, 1000);

        clearTimeout(returnTimeout);
        returnTimeout = setTimeout(() => {
            backToQR();
        }, 10000);
    }

    function backToQR() {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('qr-screen').style.display = 'block';
    }

    // 初回読み込み時に在庫データをセット
    updateStockDisplay();
</script>
</body>
</html>
